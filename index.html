<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ethics Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap');

:root {
  --bg: #f8f6f1;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-muted: #6b6560;
  --accent: #c43e2a;
  --accent-light: #f5e6e3;
  --border: #e8e2da;
  --dim-acceptable: #e67e22;
  --dim-fair: #c43e2a;
  --dim-robust: #2a7ec4;
  --dim-safe: #2aad6e;
  --dim-transparent: #c4a02a;
  --dim-vendor: #8b2ac4;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

.app-header {
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2520 100%);
  color: white;
  padding: 32px 40px;
  position: relative;
  overflow: hidden;
}
.app-header::after {
  content: '';
  position: absolute;
  right: -40px;
  top: -40px;
  width: 200px;
  height: 200px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.12;
}
.app-header h1 {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.app-header p {
  opacity: 0.7;
  font-size: 14px;
  margin-top: 4px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* Progress bar */
.progress-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 32px;
  padding: 0 4px;
}
.progress-step {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  opacity: 0.4;
  transition: all 0.3s;
}
.progress-step.active, .progress-step.completed {
  opacity: 1;
}
.progress-step .bar {
  width: 100%;
  height: 4px;
  border-radius: 4px;
  background: var(--border);
  transition: background 0.3s;
}
.progress-step.active .bar {
  background: var(--accent);
}
.progress-step.completed .bar {
  background: var(--accent);
  opacity: 0.5;
}
.progress-step .step-label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Dimension intro */
.dimension-intro {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--accent);
}
.dimension-intro .dim-icon {
  font-size: 32px;
  margin-bottom: 8px;
}
.dimension-intro h2 {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 12px;
}
.dimension-intro p {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.7;
}

/* Question card */
.question-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: all 0.3s;
}
.question-card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.question-number {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 8px;
}
.question-text {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 16px;
  line-height: 1.5;
}
.sub-question-group {
  margin-top: 12px;
}
.sub-question {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 8px;
  transition: all 0.2s;
}
.sub-question:hover {
  border-color: #ccc;
}
.sub-question-label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text);
}

/* Options */
.options-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.option-btn {
  padding: 8px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text);
  position: relative;
}
.option-btn:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}
.option-btn.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}
.option-btn .help-icon {
  display: inline-block;
  width: 16px;
  height: 16px;
  line-height: 16px;
  text-align: center;
  background: rgba(0,0,0,0.1);
  border-radius: 50%;
  font-size: 10px;
  margin-left: 6px;
  cursor: help;
  vertical-align: middle;
}
.option-btn.selected .help-icon {
  background: rgba(255,255,255,0.3);
}

/* Text input */
.text-input {
  width: 100%;
  min-height: 100px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  resize: vertical;
  transition: border-color 0.2s;
  background: var(--bg);
}
.text-input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Examples badge */
.examples-section {
  margin-top: 10px;
  padding: 10px 14px;
  background: #f0ece5;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-muted);
}
.examples-section strong {
  color: var(--text);
  font-weight: 600;
}

/* Modal / Popup */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.visible {
  opacity: 1;
  pointer-events: all;
}
.modal-content {
  background: var(--surface);
  border-radius: 16px;
  padding: 32px;
  max-width: 600px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  transform: translateY(20px);
  transition: transform 0.25s;
}
.modal-overlay.visible .modal-content {
  transform: translateY(0);
}
.modal-content h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  margin-bottom: 16px;
}
.modal-content p, .modal-content li {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-muted);
}
.modal-content ul {
  margin: 12px 0;
  padding-left: 20px;
}
.modal-content li {
  margin-bottom: 6px;
}
.modal-close {
  display: block;
  margin: 20px auto 0;
  padding: 10px 32px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.modal-close:hover {
  opacity: 0.9;
}

/* Navigation */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 32px;
  gap: 12px;
}
.nav-btn {
  padding: 12px 28px;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.nav-btn:hover {
  border-color: var(--accent);
}
.nav-btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.nav-btn.primary:hover {
  opacity: 0.9;
}
.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.save-indicator {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
}

/* Results page */
.results-section {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.results-section h2 {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  margin-bottom: 20px;
  text-align: center;
}
.chart-container {
  max-width: 500px;
  margin: 0 auto 32px;
}
.score-breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}
.score-card {
  padding: 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.score-card .sc-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.score-card .sc-value {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 800;
}

.download-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #1a1a1a, #2d2520);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 20px;
  transition: opacity 0.2s;
}
.download-btn:hover {
  opacity: 0.9;
}

.reset-btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
}

/* Welcome screen */
.welcome-screen {
  text-align: center;
  padding: 60px 20px;
}
.welcome-screen h2 {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  margin-bottom: 16px;
}
.welcome-screen p {
  color: var(--text-muted);
  font-size: 15px;
  max-width: 600px;
  margin: 0 auto 32px;
  line-height: 1.7;
}
.welcome-dimensions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}
.welcome-dim {
  padding: 20px 12px;
  background: var(--surface);
  border-radius: 10px;
  box-shadow: var(--shadow);
  text-align: center;
}
.welcome-dim .wd-icon { font-size: 28px; margin-bottom: 6px; }
.welcome-dim .wd-name { font-size: 13px; font-weight: 600; }

.start-btn {
  padding: 16px 48px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(196,62,42,0.3); }

.resume-notice {
  margin-top: 16px;
  padding: 12px 20px;
  background: #e8f5e9;
  border-radius: 8px;
  font-size: 13px;
  color: #2e7d32;
}

@media (max-width: 600px) {
  .app-header { padding: 20px; }
  .app-header h1 { font-size: 22px; }
  .container { padding: 16px 12px 60px; }
  .question-card { padding: 16px; }
  .score-breakdown { grid-template-columns: 1fr; }
  .progress-step .step-label { font-size: 8px; }
  .options-group { flex-direction: column; }
  .option-btn { width: 100%; text-align: left; }
}
</style>
</head>

// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = 'ethics_assessment_v2';
let state = {
  screen: 'welcome', // welcome | assessment | results
  currentDimension: 0,
  answers: {}
};

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.answers && Object.keys(parsed.answers).length > 0) {
        return parsed;
      }
    }
  } catch(e) {}
  return null;
}

function clearState() {
  localStorage.removeItem(STORAGE_KEY);
  state = { screen: 'welcome', currentDimension: 0, answers: {} };
  render();
}

function openModal(title, guidance, examples) {
  document.getElementById('modal-title').textContent = title;
  let html = '<p>' + guidance + '</p>';
  if (examples && examples.length > 0) {
    html += '<div style="margin-top:16px"><strong>Examples / Guiding Questions:</strong><ul>';
    examples.forEach(ex => { html += '<li>' + ex + '</li>'; });
    html += '</ul></div>';
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('visible');
}

function closeModal() {
  document.getElementById('modal').classList.remove('visible');

document.getElementById('modal').addEventListener('click', function(e) {

});

// ============================================================
// SCORING
// ============================================================
function calculateDimensionScore(dimId) {
  const dim = DATA.dimensions.find(d => d.id === dimId);
  if (!dim) return 0;
  let total = 0;

  dim.questions.forEach(q => {
    if (q.type === 'text') return; // no score
    if (q.type === 'multi_sub') {
      (q.subQuestions || []).forEach(sq => {
        const key = dimId + '.' + q.id + '.' + sq.id;
        const ans = state.answers[key];
        if (ans !== undefined) {
          const opt = sq.options.find(o => o.label === ans);
          if (opt && opt.score !== undefined && opt.score !== null) {
            total += opt.score;
          }
        }
      });
    } else if (q.type === 'single_choice') {
      const key = dimId + '.' + q.id;
      const ans = state.answers[key];
      if (ans !== undefined) {
        const opt = q.options.find(o => o.label === ans);
        if (opt && opt.score !== undefined && opt.score !== null) {
          total += opt.score;
        }
      }
    } else if (q.type === 'multi_choice') {
      const key = dimId + '.' + q.id;
      const ans = state.answers[key]; // array of labels
      if (ans && Array.isArray(ans)) {
        // Take the highest score among selected options
        let maxScore = 0;
        ans.forEach(label => {
          const opt = q.options.find(o => o.label === label);
          if (opt && opt.score !== undefined && opt.score !== null && opt.score > maxScore) {
            maxScore = opt.score;
          }
        });
        total += maxScore;
      }
    }
  });

  return total;
}

// ============================================================
// SCORING THRESHOLDS & OVERALL ACTION INDICATOR
// ============================================================
const THRESHOLDS = {
  acceptable_use:          { low: [null, 4], medium: [4, 6], high: [6, null] },
  fair_impartial:          { low: [null, 4], medium: [4, 9], high: [9, null] },
  transparent_explainable: { low: [null, 10], medium: [10, 15], high: [15, null] },
  robust_reliable:         { low: [null, 4], medium: [4, 9], high: [9, null] },
  safe_secure:             { low: [null, 5], medium: [5, 8], high: [8, null] },
  vendor:                  { low: [null, 5], medium: [5, 8], high: [8, null] }
};

// Dimension groupings for overall scoring logic
const GROUP_A = ['acceptable_use', 'fair_impartial', 'transparent_explainable']; // Higher-weight group
const GROUP_B = ['robust_reliable', 'safe_secure', 'vendor'];   // Lower-weight group

function getDimensionLevel(dimId) {
  const raw = calculateDimensionScore(dimId);
  const t = THRESHOLDS[dimId];
  if (!t) return 'low';
  // Low: score < low upper bound
  if (t.low[1] !== null && raw < t.low[1]) return 'low';
  // High: score >= high lower bound
  if (t.high[0] !== null && raw >= t.high[0]) return 'high';
  // Otherwise medium
  return 'medium';
}

function getOverallLevel() {
  const levels = {};
  DATA.dimensions.forEach(d => {
    levels[d.id] = getDimensionLevel(d.id);
  });

  const allIds = DATA.dimensions.map(d => d.id);
  const groupAIds = allIds.filter(id => GROUP_A.includes(id));
  const groupBIds = allIds.filter(id => GROUP_B.includes(id));

  // Count levels
  const countLevel = (ids, level) => ids.filter(id => levels[id] === level).length;

  // HIGH conditions:
  // 1. Any single Group A dimension is High
  if (countLevel(groupAIds, 'high') >= 1) return 'high';
  // 2. Any two Group B dimensions are High
  if (countLevel(groupBIds, 'high') >= 2) return 'high';
  // 3. Any two Group A dimensions are Medium
  if (countLevel(groupAIds, 'medium') >= 2) return 'high';
  // 4. All three Group B dimensions are Medium
  if (countLevel(groupBIds, 'medium') >= 3) return 'high';

  // LOW conditions:
  // 1. All dimensions are Low
  if (countLevel(allIds, 'low') === allIds.length) return 'low';
  // 2. Only one dimension is Medium and rest are Low
  if (countLevel(allIds, 'medium') === 1 && countLevel(allIds, 'low') === allIds.length - 1) return 'low';
  // 3. Only vendor is High and everything else is Low
  if (levels.vendor === 'high' && countLevel(allIds.filter(id => id !== 'vendor'), 'low') === allIds.length - 1) return 'low';

  // MEDIUM: all other scenarios
  return 'medium';
}

function levelColor(level) {
  if (level === 'high') return '#e74c3c';
  if (level === 'medium') return '#f39c12';
  return '#27ae60';
}

function levelLabel(level) {
  return level.charAt(0).toUpperCase() + level.slice(1);
}

  if (state.screen === 'welcome') {
    renderWelcome(app);
  } else if (state.screen === 'assessment') {
    renderAssessment(app);
  } else if (state.screen === 'results') {
    renderResults(app);
    requestAnimationFrame(() => {
      setTimeout(renderChart, 50);
    });
  }
  saveState();
}

  const hasSaved = loadState();
  let html = '<div class="welcome-screen">';
  html += '<h2>Welcome</h2>';
  html += '<p>This tool will guide you through an ethical assessment of your AI/ML use case across six key dimensions. Each dimension explores different aspects of responsible AI development.</p>';
  html += '<div class="welcome-dimensions">';
  DATA.dimensions.forEach(d => {
    html += '<div class="welcome-dim"><div class="wd-icon">' + d.icon + '</div><div class="wd-name">' + d.name + '</div></div>';
  });
  html += '</div>';
  html += '<button class="start-btn" onclick="startAssessment(false)">Begin Assessment</button>';
  if (hasSaved) {
    html += '<div class="resume-notice">You have a saved assessment in progress. <button onclick="startAssessment(true)" style="background:none;border:none;color:#2e7d32;font-weight:700;cursor:pointer;text-decoration:underline;font-family:inherit;font-size:inherit;">Resume where you left off</button></div>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function startAssessment(resume) {
  if (resume) {
    const saved = loadState();
    if (saved) {
      state = saved;
      state.screen = 'assessment';
    }
  } else {
    state = { screen: 'assessment', currentDimension: 0, answers: {} };
  }
  render();
  window.scrollTo(0, 0);
}

      if (q.conditionalOn === 'q1') {
        // Show Q2 sub-questions only for attributes selected "Yes" in Q1
        // We handle this inside the multi_sub renderer
      } else if (q.conditionalOn === 'q5_yes') {
        const q5key = dim.id + '.q5';
        if (state.answers[q5key] !== 'Yes') return;
      } else if (q.conditionalOn === 'q1_yes') {
        const q1key = dim.id + '.q1';
        if (state.answers[q1key] !== 'Yes') return;
      }
    }

    html += '<div class="question-card">';
    html += '<div class="question-number" style="color:' + color + '">Question ' + (qi + 1) + '</div>';
    html += '<div class="question-text">' + q.text + '</div>';

    if (q.type === 'text') {
      const key = dim.id + '.' + q.id;
      const val = state.answers[key] || '';
      html += '<textarea class="text-input" placeholder="Type your answer here..." onchange="setAnswer(\'' + key + '\', this.value)">' + escHtml(val) + '</textarea>';
      if (q.examples && q.examples.length > 0) {
        html += '<div class="examples-section"><strong>Example: </strong>' + q.examples[0] + '</div>';
      }
    } else if (q.type === 'single_choice') {
      html += renderOptions(q.options, dim.id + '.' + q.id);
      if (q.examples && q.examples.length > 0) {
        html += '<div class="examples-section"><strong>Examples: </strong>' + q.examples.join(', ') + '</div>';
      }
    } else if (q.type === 'multi_choice') {
      html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-style:italic;">Select all that apply</div>';
      html += renderMultiOptions(q.options, dim.id + '.' + q.id);
    } else if (q.type === 'multi_sub') {
      html += '<div class="sub-question-group">';
      (q.subQuestions || []).forEach(sq => {
        // For Q2 conditional on Q1: only show if Q1 sub was "Yes"
        if (q.conditionalOn === 'q1') {
          const q1key = dim.id + '.q1.' + sq.id.replace('q2', 'q1');
          if (state.answers[q1key] !== 'Yes') return;
        }
        html += '<div class="sub-question">';
        html += '<div class="sub-question-label">' + sq.label + '</div>';
        html += renderOptions(sq.options, dim.id + '.' + q.id + '.' + sq.id);
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>';
  });

  // Navigation
  html += '<div class="nav-bar">';
  html += '<button class="nav-btn" onclick="prevDimension()" ' + (state.currentDimension === 0 ? 'disabled' : '') + '>← Previous</button>';
  html += '<div class="save-indicator">Progress saved automatically</div>';
  if (state.currentDimension < DATA.dimensions.length - 1) {
    html += '<button class="nav-btn primary" onclick="nextDimension()">Next →</button>';
  } else {
    html += '<button class="nav-btn primary" onclick="showResults()">View Results →</button>';
  }
  html += '</div>';

  app.innerHTML = html;
}

function renderOptions(options, key) {
  const current = state.answers[key];
  let html = '<div class="options-group">';
  options.forEach(opt => {
    const sel = current === opt.label ? 'selected' : '';
    const hasHelp = opt.actionGuidance || (opt.examples && opt.examples.length > 0);
    html += '<button class="option-btn ' + sel + '" onclick="setAnswer(\'' + key + '\', \'' + escAttr(opt.label) + '\')">';
    html += opt.label;
    if (hasHelp) {
      html += '<span class="help-icon" onclick="event.stopPropagation();showGuidance(\'' + escAttr(opt.label) + '\',\'' + key + '\')">?</span>';
    }
    html += '</button>';
  });
  html += '</div>';
  return html;
}

function renderMultiOptions(options, key) {
  const current = state.answers[key] || [];
  let html = '<div class="options-group" style="flex-wrap:wrap">';
  options.forEach(opt => {
    const sel = Array.isArray(current) && current.includes(opt.label) ? 'selected' : '';
    const hasHelp = opt.actionGuidance || (opt.examples && opt.examples.length > 0);
    html += '<button class="option-btn ' + sel + '" onclick="toggleMultiAnswer(\'' + key + '\', \'' + escAttr(opt.label) + '\')">';
    html += opt.label;
    if (hasHelp) {
      html += '<span class="help-icon" onclick="event.stopPropagation();showGuidance(\'' + escAttr(opt.label) + '\',\'' + key + '\')">?</span>';
    }
    html += '</button>';
  });
  html += '</div>';
  return html;
}

function toggleMultiAnswer(key, value) {
  if (!state.answers[key] || !Array.isArray(state.answers[key])) {
    state.answers[key] = [];
  }
  const idx = state.answers[key].indexOf(value);
  if (idx >= 0) {
    state.answers[key].splice(idx, 1);
  } else {
    state.answers[key].push(value);
  }
  render();
}

function showGuidance(optLabel, key) {
  // Find the option across all data
  let guidance = '';
  let examples = [];
  let found = false;

  DATA.dimensions.forEach(dim => {
    dim.questions.forEach(q => {
      if ((q.type === 'single_choice' || q.type === 'multi_choice') && q.options) {
        if (key === dim.id + '.' + q.id) {
          const opt = q.options.find(o => o.label === optLabel);
          if (opt) {
            guidance = opt.actionGuidance || '';
            examples = opt.examples || [];
            found = true;
          }
        }
      }
      if (q.type === 'multi_sub' && q.subQuestions) {
        q.subQuestions.forEach(sq => {
          if (key === dim.id + '.' + q.id + '.' + sq.id) {
            const opt = sq.options.find(o => o.label === optLabel);
            if (opt) {
              guidance = opt.actionGuidance || '';
              examples = opt.examples || [];
              found = true;
            }
          }
        });
      }
    });
  });

  if (found && (guidance || examples.length)) {
    openModal('Action Guidance: ' + optLabel, guidance, examples);
  }
}

function setAnswer(key, value) {
  state.answers[key] = value;
  render();
}

function goToDimension(i) {
  if (i <= state.currentDimension + 1) {
    state.currentDimension = i;
    render();
    window.scrollTo(0, 0);
  }
}

function prevDimension() {
  if (state.currentDimension > 0) {
    state.currentDimension--;
    render();
    window.scrollTo(0, 0);
  }
}

function nextDimension() {
  if (state.currentDimension < DATA.dimensions.length - 1) {
    state.currentDimension++;
    render();
    window.scrollTo(0, 0);
  }
}

function showResults() {
  state.screen = 'results';
  render();
  window.scrollTo(0, 0);
  // Wait for DOM, then render chart
  requestAnimationFrame(() => {
    setTimeout(renderChart, 50);
  });
}

// ============================================================
// RESULTS + CHART
// ============================================================
let chartInstance = null;

function renderResults(app) {
  const dimColors = ['#e67e22', '#c43e2a', '#2a7ec4', '#2aad6e', '#c4a02a', '#8b2ac4'];
  const scores = DATA.dimensions.map(d => calculateDimensionScore(d.id));
  const overall = getOverallLevel();

  let html = '<div class="results-section">';
  html += '<h2>Assessment Results</h2>';

  // Overall Action Indicator
  html += '<div style="text-align:center;margin-bottom:28px;padding:24px;border-radius:12px;background:' + levelColor(overall) + '15;border:2px solid ' + levelColor(overall) + '">';
  html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:' + levelColor(overall) + ';margin-bottom:4px">Overall Action Indicator</div>';
  html += '<div style="font-family:Fraunces,serif;font-size:36px;font-weight:800;color:' + levelColor(overall) + '">' + levelLabel(overall).toUpperCase() + '</div>';
  html += '<div style="font-size:13px;color:var(--text-muted);margin-top:6px">';
  if (overall === 'high') html += 'This use case requires escalation and enhanced approval requirements.';
  else if (overall === 'medium') html += 'This use case requires standard review and monitoring.';
  else html += 'This use case has lower ethical risk. Standard processes apply.';
  html += '</div></div>';

  html += '<div class="chart-container"><canvas id="spiderChart"></canvas></div>';
  html += '<div class="score-breakdown">';
  DATA.dimensions.forEach((d, i) => {
    const lvl = getDimensionLevel(d.id);
    html += '<div class="score-card" style="border-color:' + dimColors[i] + '">';
    html += '<div class="sc-label" style="color:' + dimColors[i] + '">' + d.icon + ' ' + d.name + '</div>';
    html += '<div style="display:flex;align-items:baseline;gap:12px">';
    html += '<div class="sc-value">' + scores[i] + '</div>';
    html += '<span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:' + levelColor(lvl) + '20;color:' + levelColor(lvl) + '">' + levelLabel(lvl) + '</span>';
    html += '</div></div>';
  });
  html += '</div>';
  html += '<button class="download-btn" onclick="downloadPDF()">📥 Download PDF Report</button>';
  html += '<button class="nav-btn" style="width:100%;margin-top:12px" onclick="state.screen=\'assessment\';render();window.scrollTo(0,0)">← Back to Assessment</button>';
  html += '<button class="reset-btn" onclick="if(confirm(\'Clear all answers and start over?\')){clearState();}">Reset Assessment</button>';
  html += '</div>';
  app.innerHTML = html;
}

function renderChart() {
  const canvas = document.getElementById('spiderChart');
  if (!canvas) return;

  // Destroy existing chart instance if any
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  const dimColors = ['#e67e22', '#c43e2a', '#2a7ec4', '#2aad6e', '#c4a02a', '#8b2ac4'];
  const labels = DATA.dimensions.map(d => {
    // Split long names into two lines using ' / ' as a natural break
    if (d.name.includes(' / ')) return d.name.split(' / ').map(s => s.trim());
    return d.name;
  });
  const levelNames = [];
  const levelValues = DATA.dimensions.map(d => {
    const lvl = getDimensionLevel(d.id);
    const raw = calculateDimensionScore(d.id);
    levelNames.push(levelLabel(lvl) + ' (score: ' + raw + ')');
    return lvl === 'high' ? 3 : lvl === 'medium' ? 2 : 1;
  });

  try {
    chartInstance = new Chart(canvas, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Risk Level',
          data: levelValues,
          backgroundColor: 'rgba(196, 62, 42, 0.15)',
          borderColor: '#c43e2a',
          borderWidth: 2.5,
          pointBackgroundColor: dimColors,
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 7
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            beginAtZero: true,
            min: 0,
            max: 3,
            ticks: {
              stepSize: 1,
              font: { family: 'DM Sans', size: 11 },
              backdropColor: 'transparent',
              callback: function(value) {
                if (value === 1) return 'Low';
                if (value === 2) return 'Medium';
                if (value === 3) return 'High';
                return '';
              }
            },
            pointLabels: {
              font: { family: 'DM Sans', size: 13, weight: '600' }
            },
            grid: { color: 'rgba(0,0,0,0.08)' },
            angleLines: { color: 'rgba(0,0,0,0.08)' }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function(items) {
                return items[0].label;
              },
              label: function(context) {
                return levelNames[context.dataIndex];
              }
            }
          }
        }
      }
    });
  } catch(e) {
    console.error('Chart rendering error:', e);
  }
}

// ============================================================
// PDF EXPORT
// ============================================================
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const scores = DATA.dimensions.map(d => calculateDimensionScore(d.id));
  const overall = getOverallLevel();
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 20;
  const contentW = pageW - margin * 2;

  // --- Header ---
  doc.setFillColor(26, 26, 26);
  doc.rect(0, 0, pageW, 38, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18);
  doc.setFont(undefined, 'bold');
  doc.text('AI Ethics Assistant', margin, 18);
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.text('Assessment Report', margin, 26);
  doc.text('Generated: ' + new Date().toLocaleDateString(), margin, 33);
  doc.setTextColor(0, 0, 0);

  // --- Overall Action Indicator ---
  let y = 50;
  const oc = overall === 'high' ? [231, 76, 60] : overall === 'medium' ? [243, 156, 18] : [39, 174, 96];
  doc.setFillColor(oc[0], oc[1], oc[2]);
  doc.roundedRect(margin, y, contentW, 16, 3, 3, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(13);
  doc.setFont(undefined, 'bold');
  doc.text('Overall Action Indicator:  ' + levelLabel(overall).toUpperCase(), margin + 6, y + 10.5);
  doc.setTextColor(0, 0, 0);

  // --- Dimension Scores Table ---
  y += 26;
  doc.setFontSize(13);
  doc.setFont(undefined, 'bold');
  doc.text('Dimension Scores', margin, y);
  y += 8;

  // Table header
  doc.setFillColor(240, 240, 240);
  doc.rect(margin, y, contentW, 8, 'F');
  doc.setFontSize(9);
  doc.setFont(undefined, 'bold');
  doc.text('Dimension', margin + 4, y + 5.5);
  doc.text('Raw Score', margin + 110, y + 5.5);
  doc.text('Level', margin + 140, y + 5.5);
  y += 8;

  doc.setFont(undefined, 'normal');
  doc.setFontSize(10);
  DATA.dimensions.forEach((d, i) => {
    const lvl = getDimensionLevel(d.id);
    const lc = lvl === 'high' ? [231, 76, 60] : lvl === 'medium' ? [243, 156, 18] : [39, 174, 96];

    // Alternating row background
    if (i % 2 === 0) {
      doc.setFillColor(248, 248, 248);
      doc.rect(margin, y, contentW, 7, 'F');
    }
    doc.text(d.name, margin + 4, y + 5);
    doc.text(String(scores[i]), margin + 115, y + 5);
    // Level badge
    doc.setFillColor(lc[0], lc[1], lc[2]);
    doc.roundedRect(margin + 138, y + 0.5, 22, 6, 1.5, 1.5, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(7);
    doc.setFont(undefined, 'bold');
    doc.text(levelLabel(lvl), margin + 142, y + 4.8);
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    y += 7;
  });

  // --- Detailed Answers ---
  y += 10;
  DATA.dimensions.forEach((dim, di) => {
    // Dimension header
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFillColor(240, 236, 230);
    doc.rect(margin, y, contentW, 9, 'F');
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    doc.text((di + 1) + '.  ' + dim.name, margin + 4, y + 6.5);
    y += 13;

    dim.questions.forEach((q, qi) => {
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setFontSize(9);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(100, 100, 100);
      doc.text('Q' + (qi + 1), margin + 2, y);
      doc.setTextColor(0, 0, 0);
      const qLines = doc.splitTextToSize(q.text, contentW - 14);
      doc.text(qLines, margin + 12, y);
      y += qLines.length * 4.5 + 2;

      doc.setFont(undefined, 'normal');
      doc.setFontSize(9);

      if (q.type === 'text') {
        const key = dim.id + '.' + q.id;
        const val = state.answers[key] || '(No answer)';
        doc.setTextColor(60, 60, 60);
        const lines = doc.splitTextToSize(val, contentW - 20);
        doc.text(lines, margin + 14, y);
        y += lines.length * 4.2 + 4;
        doc.setTextColor(0, 0, 0);
      } else if (q.type === 'single_choice') {
        const key = dim.id + '.' + q.id;
        const val = state.answers[key] || '(No answer)';
        doc.setTextColor(60, 60, 60);
        doc.text(val, margin + 14, y);
        y += 6;
        doc.setTextColor(0, 0, 0);
      } else if (q.type === 'multi_choice') {
        const key = dim.id + '.' + q.id;
        const val = state.answers[key];
        const display = Array.isArray(val) && val.length > 0 ? val.join(', ') : '(No answer)';
        doc.setTextColor(60, 60, 60);
        const lines = doc.splitTextToSize(display, contentW - 20);
        doc.text(lines, margin + 14, y);
        y += lines.length * 4.2 + 4;
        doc.setTextColor(0, 0, 0);
      } else if (q.type === 'multi_sub') {
        (q.subQuestions || []).forEach(sq => {
          if (y > 270) { doc.addPage(); y = 20; }
          const sqKey = dim.id + '.' + q.id + '.' + sq.id;
          const val = state.answers[sqKey] || '(No answer)';
          doc.setFont(undefined, 'bold');
          doc.setFontSize(8);
          doc.text(sq.label + ':', margin + 14, y);
          doc.setFont(undefined, 'normal');
          doc.setTextColor(60, 60, 60);
          doc.text(val, margin + 14 + doc.getTextWidth(sq.label + ':  '), y);
          doc.setTextColor(0, 0, 0);
          doc.setFontSize(9);
          y += 5;
        });
        y += 2;
      }
    });

    // Separator line between dimensions
    doc.setDrawColor(220, 220, 220);
    doc.line(margin, y, pageW - margin, y);
    y += 6;
  });

  // --- Footer on last page ---
  doc.setFontSize(7);
  doc.setTextColor(160, 160, 160);
  doc.text('AI Ethics Assistant - Confidential', margin, doc.internal.pageSize.getHeight() - 10);
  doc.setTextColor(0, 0, 0);

  doc.save('ethics_assessment_report.pdf');
}

// ============================================================
// HELPERS
// ============================================================
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '\\"');
}
